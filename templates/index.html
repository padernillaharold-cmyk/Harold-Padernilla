<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student API Interface</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 700px;
                margin: 40px auto;
                padding: 20px;
                color: #222;
            }

            button {
                padding: 8px 14px;
                margin: 5px;
                cursor: pointer;
            }

            input {
                padding: 8px;
            }

            #crudForm {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            #studentTable {
                width: 100%;
                border-collapse: collapse;
            }

            #studentTable th,
            #studentTable td {
                border: 1px solid #cccccc;
                padding: 8px;
                text-align: left;
            }

            #studentTable tr[data-id] {
                cursor: pointer;
            }

            #result {
                margin-top: 20px;
                padding: 10px;
                border: 1px solid #cccccc;
            }
        </style>
    </head>
    <body>
        <h1>Student API Interface</h1>
        <button onclick="loadStudent()">Load Student Information</button>
        <div id="result"></div>

        <hr>
        <h2>Greeting API</h2>
        <input type="text" id="nameInput" placeholder="Enter your first name">
        <button onclick="sayHello()">Say Hello</button>
        <p id="greeting"></p>

        <hr>
        <h2>Course API</h2>
        <button onclick="loadCourse()">Load Course Information</button>
        <div id="course-result"></div>

        <hr>
        <h2>Student CRUD</h2>
        <div id="crudForm">
            <input type="number" id="recordId" placeholder="Record ID" disabled>
            <input type="text" id="studentId" placeholder="Student ID">
            <input type="text" id="studentName" placeholder="Name">
            <input type="text" id="studentProgram" placeholder="Program">
            <input type="number" id="studentYear" placeholder="Year Level" min="1">
            <input type="text" id="studentSection" placeholder="Section">
        </div>
        <button onclick="createStudent()">Add</button>
        <button onclick="updateStudent()">Edit</button>
        <button onclick="deleteStudent()">Delete</button>
        <button onclick="clearStudentForm()">Clear</button>
        <p id="crudStatus"></p>
        <h3>My Records</h3>
        <p><strong>Source:</strong> This application's local database</p>
        <button onclick="readStudents()">Load My Records</button>
        <input type="search" id="localStudentSearch" placeholder="Search ID, name, program, year, or section">
        <table id="studentTable"></table>
        <div id="localStudentDetails"></div>

        <hr>
        <h2>Classmate's Records</h2>
        <p><strong>Source:</strong> Partner's public API URL</p>
        <input
            type="url"
            id="classmateApiUrl"
            placeholder="https://classmate-app.onrender.com/api/students"
            style="width: 100%; box-sizing: border-box;"
        >
        <button onclick="loadClassmateStudents()">Load Classmate Records</button>
        <div id="classmateStatus"></div>
        <table id="classmateTable"></table>
        <div id="classmateStudentDetails"></div>

        <script>
            window.addEventListener('DOMContentLoaded', readStudents);
            let localStudents = [];
            let classmateStudents = [];

            function loadClassmateStudents() {
                const apiUrl = document.getElementById('classmateApiUrl').value.trim();
                const status = document.getElementById('classmateStatus');
                const table = document.getElementById('classmateTable');
                status.innerText = '';
                table.innerHTML = '';

                if (!apiUrl) {
                    status.innerText = 'Enter your classmate API URL.';
                    return;
                }

                fetch('/api/classmate/students?url=' + encodeURIComponent(apiUrl))
                    .then(response => response.json().then(data => ({ response, data })))
                    .then(({ response, data }) => {
                        if (!response.ok) {
                            throw new Error(data.error || 'Unable to retrieve records.');
                        }

                        classmateStudents = data;
                        const header = '<tr><th>Student ID</th><th>Name</th><th>Program</th><th>Year</th><th>Section</th></tr>';
                        const rows = data.map(student =>
                            '<tr data-index="' + data.indexOf(student) + '" style="cursor:pointer"><td>' + escapeHtml(student.student_id) + '</td>' +
                            '<td>' + escapeHtml(student.name) + '</td>' +
                            '<td>' + escapeHtml(student.program) + '</td>' +
                            '<td>' + escapeHtml(student.year) + '</td>' +
                            '<td>' + escapeHtml(student.section) + '</td></tr>'
                        ).join('');
                        table.innerHTML = header + rows;
                        document.querySelectorAll('#classmateTable tr[data-index]').forEach(row => {
                            row.addEventListener('click', () => showClassmateDetails(classmateStudents[Number(row.dataset.index)]));
                        });
                        status.innerText = 'Loaded ' + data.length + ' classmate record(s).';
                    })
                    .catch(error => {
                        status.innerText = error.message || 'Unable to retrieve classmate records.';
                    });
            }

            function escapeHtml(value) {
                const element = document.createElement('div');
                element.textContent = value == null ? '' : String(value);
                return element.innerHTML;
            }

            function renderStudentDetails(containerId, student, source) {
                document.getElementById(containerId).innerHTML =
                    '<h3>' + escapeHtml(source) + ' Record Details</h3>' +
                    '<p><strong>Record ID:</strong> ' + escapeHtml(student.id) + '</p>' +
                    '<p><strong>Student ID:</strong> ' + escapeHtml(student.student_id) + '</p>' +
                    '<p><strong>Name:</strong> ' + escapeHtml(student.name) + '</p>' +
                    '<p><strong>Program:</strong> ' + escapeHtml(student.program) + '</p>' +
                    '<p><strong>Year:</strong> ' + escapeHtml(student.year) + '</p>' +
                    '<p><strong>Section:</strong> ' + escapeHtml(student.section) + '</p>';
            }

            function showClassmateDetails(student) {
                renderStudentDetails('classmateStudentDetails', student, 'Remote Classmate');
            }

            function requestJson(url, options = {}) {
                return fetch(url, options)
                    .then(response => response.json().then(data => ({ response, data })))
                    .then(({ response, data }) => {
                        if (!response.ok) {
                            throw new Error(data.error || data.message || 'Request failed');
                        }
                        return data;
                    });
            }

            function getStudentData() {
                return {
                    student_id: document.getElementById('studentId').value.trim(),
                    name: document.getElementById('studentName').value.trim(),
                    program: document.getElementById('studentProgram').value.trim(),
                    year: Number(document.getElementById('studentYear').value),
                    section: document.getElementById('studentSection').value.trim()
                };
            }

            function setCrudStatus(message, isError = false) {
                const status = document.getElementById('crudStatus');
                status.innerText = message;
                status.style.color = isError ? 'red' : 'green';
            }

            function clearStudentForm() {
                ['recordId', 'studentId', 'studentName', 'studentProgram',
                    'studentYear', 'studentSection'].forEach(id => {
                    document.getElementById(id).value = '';
                });
            }

            function validateStudentData(data) {
                if (!data.student_id || !data.name || !data.program ||
                    !data.year || !data.section) {
                    setCrudStatus('Complete all student fields.', true);
                    return false;
                }
                return true;
            }

            function readStudents() {
                requestJson('/api/students')
                    .then(students => {
                        localStudents = students;
                        renderLocalStudents(students);
                        setCrudStatus('Loaded ' + students.length + ' student(s).');
                    })
                    .catch(error => setCrudStatus(error.message, true));
            }

            function renderLocalStudents(students) {
                let rows = '<tr><th>ID</th><th>Student ID</th><th>Name</th><th>Program</th><th>Year</th><th>Section</th></tr>';
                students.forEach(student => {
                    rows += '<tr data-id="' + student.id + '" style="cursor:pointer">' +
                                '<td>' + student.id + '</td>' +
                                '<td>' + student.student_id + '</td>' +
                                '<td>' + student.name + '</td>' +
                                '<td>' + student.program + '</td>' +
                                '<td>' + student.year + '</td>' +
                                '<td>' + student.section + '</td>' +
                                '</tr>';
                });
                document.getElementById('studentTable').innerHTML = rows;
                document.querySelectorAll('#studentTable tr[data-id]').forEach(row => {
                    row.addEventListener('click', () => {
                        const id = Number(row.dataset.id);
                        requestJson('/api/students/' + id).then(student => {
                            document.getElementById('recordId').value = student.id;
                            document.getElementById('studentId').value = student.student_id;
                            document.getElementById('studentName').value = student.name;
                            document.getElementById('studentProgram').value = student.program;
                            document.getElementById('studentYear').value = student.year;
                            document.getElementById('studentSection').value = student.section;
                            renderStudentDetails('localStudentDetails', student, 'Local');
                            });
                        });
                });
            }

            document.addEventListener('input', event => {
                if (event.target.id !== 'localStudentSearch') return;
                const query = event.target.value.toLowerCase();
                const filtered = localStudents.filter(student =>
                    [student.id, student.student_id, student.name, student.program,
                        student.year, student.section].some(value =>
                        String(value).toLowerCase().includes(query))
                );
                renderLocalStudents(filtered);
            });

            function createStudent() {
                const data = getStudentData();
                if (!validateStudentData(data)) return;
                requestJson('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(result => {
                        setCrudStatus(result.message + ' (ID: ' + result.id + ')');
                        clearStudentForm();
                        readStudents();
                    })
                    .catch(error => setCrudStatus(error.message, true));
            }

            function updateStudent() {
                const id = document.getElementById('recordId').value;
                const data = getStudentData();
                if (!id) {
                    setCrudStatus('Select a student row, then edit it.', true);
                    return;
                }
                if (!validateStudentData(data)) return;
                requestJson('/api/students/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(result => {
                        setCrudStatus(result.message);
                        readStudents();
                    })
                    .catch(error => setCrudStatus(error.message, true));
            }

            function deleteStudent() {
                const id = document.getElementById('recordId').value;
                if (!id) {
                    setCrudStatus('Select a student row, then delete it.', true);
                    return;
                }
                requestJson('/api/students/' + id, { method: 'DELETE' })
                    .then(result => {
                        setCrudStatus(result.message);
                        clearStudentForm();
                        readStudents();
                    })
                    .catch(error => setCrudStatus(error.message, true));
            }

            function loadStudent() {
                fetch('/student')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('result').innerHTML =
                            '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                            '<p><b>Name:</b> ' + data.name + '</p>' +
                            '<p><b>Program:</b> ' + data.program + '</p>' +
                            '<p><b>Year:</b> ' + data.year + '</p>' +
                            '<p><b>Section:</b> ' + data.section + '</p>';
                    })
                    .catch(error => {
                        document.getElementById('result').innerHTML =
                            '<p>Unable to retrieve data.</p>';
                    });
            }

            function sayHello() {
                const name = document.getElementById('nameInput').value;
                fetch('/hello?name=' + encodeURIComponent(name))
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('greeting').innerText = data.message;
                    })
                    .catch(error => {
                        document.getElementById('greeting').innerText =
                            'Unable to retrieve greeting.';
                    });
            }

            function loadCourse() {
                fetch('/course')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('course-result').innerHTML =
                            '<p><b>Course Code:</b> ' + data.course_code + '</p>' +
                            '<p><b>Course Name:</b> ' + data.course_name + '</p>' +
                            '<p><b>Program:</b> ' + data.program + '</p>' +
                            '<p><b>Year Level:</b> ' + data.year_level + '</p>';
                    })
                    .catch(error => {
                        document.getElementById('course-result').innerHTML =
                            '<p>Unable to retrieve course information.</p>';
                    });
            }
        </script>
    </body>
</html>
